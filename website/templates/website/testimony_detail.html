{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ testimony.full_name }} | Testimonial</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/mediaqueries.css' %}">
</head>

<body>

    <nav class="page-nav">
        <a class="page-logo" href="{% url 'home' %}">
            Mark Ravao
        </a>

        <div class="page-nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'project_list' %}">Projects</a>
            <a href="{% url 'inquiry_create' %}">Inquiry</a>
        </div>
    </nav>

    <main class="form-page">
        <section class="form-container">
            <p class="form-description">Testimonial</p>

            <h1>{{ testimony.full_name }}</h1>

            <article class="content-card">
                <p>{{ testimony.content }}</p>
            </article>

            <div class="form-actions">
                <a class="page-btn"
                   href="{% url 'testimony_list' %}">
                    Back to Testimonials
                </a>

                <a class="page-btn primary-btn"
                   href="{% url 'testimony_create' %}">
                    Leave a Testimonial
                </a>
            </div>
        </section>
    </main>

</body>
</html>
