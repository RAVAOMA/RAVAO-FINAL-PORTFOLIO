{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ project.project_name }} | Mark Ravao</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/mediaqueries.css' %}">

</head>

<body>

    {% include "website/_page_nav.html" %}

    <section id="project-detail">

        <p class="section__text__p1">
            Project Details
        </p>

        <h1 class="title">
            {{ project.project_name }}
        </h1>

        <div class="project-detail-card">

            <div class="project-section">

                <h2>Description</h2>

                <p>
                    {{ project.description }}
                </p>

            </div>

            <div class="project-section">

                <h2>Technology Stack</h2>

                <div class="tech-stack">

                    {% for tech in project.tech_stack.split %}

                    <span class="tech-badge">
                        {{ tech }}
                    </span>

                    {% endfor %}

                </div>

            </div>

            <div class="project-buttons">

                <a
                    href="{{ project.link }}"
                    target="_blank"
                    class="btn btn-color-1">

                    Visit Project

                </a>

                <a
                    href="{% url 'project_list' %}"
                    class="btn btn-color-2">

                    Back to Projects

                </a>

            </div>

        </div>

    </section>

</body>

</html>
